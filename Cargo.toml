[workspace]
resolver = "2"
members = [
  "backend/tunnel-manager", "backend/explorer", "backend/shared",
  "backend/transcript-store", "backend/transcript-stream",
  "rust/engine/tunnel-core", "rust/engine/tunnel-harness",
  "rust/engine/sui-tunnel-anchor", "rust/engine/telemetry",
  "rust/protocols/api-credits", "rust/protocols/blackjack",
  "rust/protocols/battleship",
  "rust/protocols/bomb-it",
  "rust/protocols/caro",
  "rust/protocols/chat", "rust/protocols/payments",
  "rust/protocols/cross",
  "rust/protocols/flash",
  "rust/protocols/quantum-poker",
  "rust/protocols/tic-tac-toe",
  "rust/protocols/world-canvas",
  "rust/fleet/serve", "rust/fleet/bench", "rust/fleet/core",
  "rust/services/bot-fleet",
  "wallet-pool", "wallet-pool/core", "wallet-pool/s3",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
# `enable-rustls-ring` (not `enable-rustls`) so fred's TLS reuses the `ring` provider
# reqwest already pulls — a single rustls CryptoProvider avoids the 0.23 multi-provider
# panic, and ring needs no cmake (aws-lc does). Lets `rediss://` ElastiCache URLs connect.
fred = { version = "9", features = ["i-scripts", "subscriber-client", "enable-rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"
bech32 = "0.9"
blake2 = "0.10"
ed25519-dalek = "2"
# Lightweight crates.io Sui SDK (write path: PTB build + Ed25519 sign + BCS).
# Replaces the monorepo `sui-sdk` git dep, which does not compile on rustc 1.95
# (starlark_map/allocative skew). Reads/execution go via JSON-RPC over reqwest.
# NOTE: this supersedes ADR-0002's "sui-sdk (git, MystenLabs)" Tech-Stack line.
sui-sdk-types = "0.3"
sui-transaction-builder = "0.3"
# gRPC fullnode client (tonic). Same 0.3.x sui-rust-sdk family as the crates
# above, so it shares their toolchain. Read/execute path for the anchor; the
# anchor issues only point lookups + executes, so gRPC suffices over GraphQL.
sui-rpc = "0.3"
# gRPC status/code matching for the sui-rpc client (NotFound -> Ok(None)).
tonic = { version = "0.14", default-features = false }
sui-crypto = { version = "0.3", features = ["ed25519"] }
bcs = "0.2"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde-big-array = "0.5"
base64 = "0.22"
# Postgres read-model for the explorer index (settlement history). rustls to reuse
# the single ring CryptoProvider already selected for fred/reqwest (no aws-lc/cmake).
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls", "postgres", "macros", "migrate", "chrono",
] }
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.32"
getrandom = "0.2"
thiserror = "1"
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
