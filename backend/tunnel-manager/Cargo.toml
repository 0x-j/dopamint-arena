[package]
name = "tunnel-manager"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-util = []

[dependencies]
tokio.workspace = true
tokio-stream.workspace = true
tokio-util = "0.7"
axum = { workspace = true, features = ["ws"] }
tower.workspace = true
tower-http.workspace = true
http = "1"
futures = "0.3"
ed25519-dalek = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
uuid.workspace = true
async-trait.workspace = true
fred.workspace = true
reqwest.workspace = true
hex.workspace = true
sui-sdk-types.workspace = true
sui-transaction-builder.workspace = true
sui-crypto.workspace = true
bcs.workspace = true
base64.workspace = true
# Session-auth JWT (HS256): backend-issued token gating spend endpoints (arena allocate). See auth.rs.
jsonwebtoken = "9"
aws-config = "1"
aws-sdk-s3 = "1"
# Direct rustls dep so we can install `ring` as the process-default CryptoProvider at
# startup (Task 7), forcing fred/reqwest/aws-sdk onto one provider. See Cargo.toml
# TLS-provider note + ADR-0023.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Co-located fleet (ADR-0024): bots run in-process on the relay over the bus transport, driving the
# same transport-agnostic orchestration the WS bot-fleet uses. `tunnel-harness` is for the
# `FrameTransport`/`RelayTransport` error type the seam returns.
fleet-core = { path = "../../rust/fleet/core" }
tunnel-harness = { path = "../../rust/engine/tunnel-harness" }
# The canonical settlement-v2 wire serializer (`serialize_settlement_with_root`) the bot signs its
# forced forfeit half over. Promoted from a dev-dep to a normal dep so the arena forfeit path (not
# just tests) can reach it — `tunnel-harness` re-exports `wire_hex`/`transcript`, not `wire`.
tunnel-core = { path = "../../rust/engine/tunnel-core" }
# Streaming transcript: the bot streams the co-signed transcript to S3 in chunks during play.
# `transcript-store` = the S3 chunk store; `transcript-stream` = the recorder + bounded uploader.
transcript-store = { path = "../transcript-store" }
transcript-stream = { path = "../transcript-stream" }
# Flash self-play loop (Mode 2): drives the flash protocol in-process with both seats.
tunnel-flash = { path = "../../rust/protocols/flash" }
# Funded seat-B identities for on-demand arena bots (PR #124): the 1M-member pool, opened once at
# startup, gives each bot a real on-chain address from `get_member_key`. Gated by WALLET_POOL_ID.
wallet-pool = { path = "../../wallet-pool" }
wallet-pool-core = { path = "../../wallet-pool/core" }
wallet-pool-s3 = { path = "../../wallet-pool/s3" }
sui-tunnel-anchor = { path = "../../rust/engine/sui-tunnel-anchor" }
bech32.workspace = true

[dev-dependencies]
tokio-tungstenite = "0.24"
wiremock = "0.6"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["redis"] }
ctor = "0.2"
# in-memory FakeChunkStore for the forfeit recorder-seal regression (colocated.rs)
transcript-store = { path = "../transcript-store", features = ["testing"] }
